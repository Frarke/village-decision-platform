function overview(){const m=DATA.metrics,cfg=m.configuration||{};let title='',html='';if(view==='scheme'){title='当前方案配置';html='<div class="unit-summary">'+esc(currentLabel)+' · '+units().features.length+' 个治理单元'+'</div><h3>按单元定位措施</h3>'+unitLinks()+'<details><summary>方案选择依据</summary><p class="muted">'+esc(solution().basis.replaceAll('Pareto','非劣方案'))+'</p><p class="muted">非劣方案：无法在不降低其他目标的同时提高某一目标。</p></details><div class="notice">图标按治理单元归组。引线连接所属单元，放大可分辨相邻单元；点击查看工程示意及费用。</div>';}else if(view==='effects'){title='治理前后预测成效';html=comparisons(solution().objectives,result.summary.baseline_objectives)+'<p class="muted">基线为同一输入与模型下“不实施措施”的评价。经济性基线为无治理投入状态，配置措施后可能下降；四项目标需要权衡。</p><h3>单元成效分布</h3><p class="muted">地图按所选单元指标着色。区域分值包含风险权重与协同聚合，不等于单元分值的简单平均。</p><div class="notice">显示模型预测分值变化；尚无治理后风险栅格或实测效果。模拟输入与待标定参数不能作为当地实际治理效果。</div>';}else{const stage=$('trace').value;title={input:'已有评价资料',priority:'重点区域识别依据',units:'治理单元划分依据'}[stage];if(stage==='input')html='<div class="unit-summary">已有评价是计算输入。底图仅用于定位，卫星影像本身不参与风险评分。</div><h3>当前评价范围</h3><p class="muted">有效像元 '+esc(m.valid_features)+' 个；研究范围内 '+esc(m.clipped_features)+' 个。点击像元可查看原始评价数值。</p><p class="muted">图例给出实际分级区间。未提供的可选评价显示灰色，不按零值处理。</p>';if(stage==='priority')html='<div class="unit-summary">风险等级 ≥ '+esc(cfg.risk_threshold??3)+'，或距承灾体 ≤ '+esc(cfg.receptor_distance_m??100)+' 米，或已有隐患 / 重点关注标记。</div><div class="stats"><div class="stat">重点像元<strong>'+esc(m.priority_features)+'</strong></div><div class="stat">重点面积 / 公顷<strong>'+num(m.priority_area_m2/10000)+'</strong></div></div><p class="muted">这是规则识别的中间结果，用于确定后续治理对象。</p>';if(stage==='units')html='<div class="unit-summary">范围裁剪 → 重点像元筛选 → 同调查区共边连通 → 斑块过滤 → 编号与统计。</div><p class="muted">最小面积 '+esc(cfg.min_area_m2)+' 平方米；邻近合并距离 '+esc(cfg.merge_distance_m)+' 米。治理边界来自实际选中像元的几何并集。</p><h3>已生成 '+esc(m.governance_unit_count)+' 个单元</h3>'+unitLinks();html+='<div class="notice">'+(DATA.village.data_status==='MOCK'?'当前研究范围、评价、调查及路径均为模拟，不代表当地存在对应灾害。':'请依据输入资料来源复核空间识别结果。')+'</div>';}$('panelTitl rHTML=text;$('backOverview').onclick=()=>{selected=null;selection.clearLayers();overview();};}
function placeCards(){markers.clearLayers();if(view!=='scheme'&&!(view==='trace'&&$('trace').value==='units')&&view!=='effects')return;const size=map.getSize(),rects=[],cards=[];for(const f of units().features){const p=f.properties,ids=view==='scheme'?mids(p):[],width=Math.max(48,42+ids.length*27),height=33,anchor=map.latLngToContainerPoint([p.latitude,p.longitude]);if(anchor.x<0||anchor.y<0||anchor.x>size.x||anchor.y>size.y)continue;let pos=null;const offsets=[[0,0]];for(let r=42;r<=252;r+=42)for(let a=0;a<8;a++)offsets.push([Math.cos(a*Math.PI/4)*r,Math.sin(a*Math.PI/4)*r]);for(const [dx,dy] of offsets){const x=Math.max(width/2+8,Math.min(size.x-width/2-8,anchor.x+dx)),y=Math.max(45,Math.min(size.y-35,anchor.y+dy));const rect={x:x-width/2-5,y:y-height/2-5,w:width+10,h:height+10};const legendRect=$('legend').getBoundingClientRect(),mapRect=$('map').getBoundingClientRect(),lr={x:legendRect.left-mapRect.left-5,y:legendRect.top-mapRect.top-5,w:legendRect.width+10,h:legendRect.height+10};if([...rects,lr].every(b=>rect.x+rect.w<b.x||b.x+b.w<rect.x||rect.y+rect.h<b.y||b.y+b.h<rect.y)){pos={x,y};rects.push(rect);break;}}if(!pos){const nearest=cards.reduce((best,c)=>!best||Math.hypot(c.pos.x-anchor.x,c.pos.y-anchor.y)<Math.hypot(best.pos.x-anchor.x,best.pos.y-anchor.y)?c:best,null);if(nearest){nearest.features.push(f);continue;}pos=anchor;}cards.push({pos,features:[f],width,height});}
for(const card of cards){const p=card.features[0].properties,ids=view==='scheme'?mids(p):[],ll=map.containerPointToLatLng(card.pos),multi=card.features.length>1;for(const f of card.features)L.polyline([[f.properties.latitude,f.properties.longitude],ll],{color:'#e4eef0',weight:1.5,opacity:.9,interactive:false}).addTo(markers);const html=multi?'<b>'+card.features.length+' 个单元 · 点击展开</b>':'<b>'+esc(p.unit_id)+'</b>'+ids.map(symbol).join('');const badge=L.marker(ll,{title:multi?'展开相邻治理单元':p.unit_id+' '+ids.map(mid=>DATA.names[mid]).join('、'),icon:L.divIcon({className:'measure-marker',html,iconSize:[card.width,card.height],iconAnchor:[card.width/2,card.height/2]})}).on('click',()=>{if(multi){$('panelTitle').textContent='相邻治理单元';$('panelContent').innerHTML=card.features.map(f=>'<button class="unit-link" data-unit="'+esc(f.properties.unit_id)+'">'+esc(f.properties.unit_id)+' · 点击定位</button>').join('');bindUnitLinks();}else showUnit(card.features[0]);}).addTo(markers);badge.getElement().setAttribute('aria-label',multi?'展开相邻治理单元':p.unit_id+' '+(ids.map(mid=>DATA.names[mid]).join('、')||'治理单元'));}}
function draw(){overlay.clearLayers();selection.clearLayers();markers.clearLayers();document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view);});$('tracebar').hidden=view!=='trace';$('effectbar').hidden=view!=='effects';$('field').hidden=$('trace').value!=='input';overview();const stage=view==='trace'?$('trace').value:view;if(stage==='input'){L.geoJSON(DATA.evaluation,{style:f=>({fillColor:fieldColor(f.properties),fillOpacity:.62,color:'#334b5544',weight:.3}),onEachFeature:(f,l)=>l.bindPopup('<b>输入像元 '+esc(f.properties.feature_id)+'</b><br>风险 '+esc(f.properties.risk)+' 级 · 危险性 '+esc(f.properties.haz)+' 级<br>易发性 '+esc(f.properties.susceptibility??'未提供')+' · 易损性 '+esc(f.properties.vulnerability??'未提供')+'<br>坡度 '+esc(f.properties.slope_deg)+'° · 距承灾体 '+esc(f.properties.distance_m)+' 米')}).addTo(overlay);$('legend').innerHTML='<b>'+esc($('field').selectedOptions[0].text)+'</b>'+palette.map((c,i)=>swatch(c,fieldBins().labels[i])).join('')+swatch('#abb8be','未提供');}else if(stage==='priority'){L.geoJSON(DATA.priority,{style:{color:'#ff8a52',weight:.6,fillColor:'#df6846',fillOpacity:.65},onEachFeature:(f,l)=>l.bindPopup(esc(f.properties.selection_reasons.join('；')))}).addTo(overlay);$('legend').innerHTML=swatch('#df6846','识别出的重点治理区域');}else{L.geoJSON(units(),{style:f=>({color:'#e3f0ef',weight:2,fillColor:stage==='effects'?effectColor(f.properties):'#4595a0',fillOpacity:stage==='effects'?.72:.24}),onEachFeature:(f,l)=>l.on('click',()=>showUnit(f)).bindTooltip(esc(f.properties.unit_id)+' · '+num(f.properties.area_m2/10000)+' 公顷')}).addTo(overlay);if(stage==='scheme'){const ids=[...new Set(result.map_result.measure_placements[currentLabel].features.map(f=>f.properties.measure_id))];$('legend').innerHTML='<b>措施符号 · 与地图一致</b>'+ids.map(mid=>'<div>'+symbol(mid)+esc(DATA.names[mid])+'</div>').join('')+swatch('#4595a0','治理单元范围');}else if(stage==='effects'){const isChange=$('period').value==='change';$('legend').innerHTML='<b>'+esc($('effect').selectedOptions[0].text)+' · '+esc($('period').selectedOptions[0].text)+'</b>'+(isChange?changes:scores).map((c,i)=>swatch(c,(isChange?['下降（<0）','无变化（0）','提升 >0–<10 分','提升 10–<30 分','提升 ≥30 分']:['0–<25 分','25–<50 分','50–<75 分','75–100 分'])[i])).join('');}else $('legend').innerHTML=swatch('#4595a0','自动生成的治理单元');}
$('legend').innerHTML+='<div><span style="width:16px;border-top:2px dashed #d8e3e7;background:#516570"></span>研究范围</div>';if(stage!=='input'&&stage!=='priority')$('legend').innerHTML+='<div><i style="width:16px;height:12px;border:3px solid #ffe28b;background:#516570"></i>选中单元边界</div>';if($('paths').checked){for(const f of DATA.context.features||[]){if(f.properties.kind==='path')L.geoJSON(f,{style:{color:'#e9cf5c',weight:3,dashArray:'7 5'}}).bindTooltip(esc(f.properties.name||f.properties.record_id)+' · 显式输入路径').addTo(overlay);}$('legend').innerHTML+='<div><span style="width:16px;border-top:3px dashed #e9cf5c"></span>输入风险路径</div>';}
if(selected&&['scheme','effects','units'].includes(stage))showUnit(units().features.find(f=>f.properties.unit_id===selected));updateBenefits();placeCards();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;draw();});for(const id of ['trace','field','effect','period','paths'])$(id).onchange=()=>{selected=null;draw();};$('scheme').onchange=()=>{currentLabel=$('scheme').value;draw();};$('basemap').onchange=()=>{map.removeLayer(activeBase);activeBase=baseLayers[$('basemap').value];activeBase.addTo(map);};$('fit').onclick=()=>map.fitBounds(bounds,{padding:[40,40]});map.on('zoomend moveend resize',placeCards);draw();
new ResizeObserver(()=>{map.invalidateSize();if(parent!==window)parent.postMessage({type:'decision-map-height',height:document.body.scrollHeight},'*');}).observe(document.body);
</script></body></html>
