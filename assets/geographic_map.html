<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>村域空间治理决策成果</title>
<style>__LEAFLET_CSS__</style><style>
*{box-sizing:border-box}body{margin:0;font:14px "Microsoft YaHei",sans-serif;color:#18343d;background:#f4f7f9}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #daab31}
.top{padding:16px 22px;background:#122f39;color:#fff;display:flex;justify-content:space-between;gap:18px;align-items:center}.top h1{margin:0;font-size:21px}.top p{margin:5px 0 0;color:#bad5dd;font-size:12px}.status{background:#fbf2d8;color:#77551d;padding:7px 12px;border-radius:5px;font-size:12px}
.toolbar{padding:10px 14px;background:white;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #d5e1e5}.steps{display:flex;gap:6px;flex-wrap:wrap}.step{border:1px solid #d1dee2;border-radius:5px;padding:9px 12px;background:white;color:#41606a}.step.active{background:#166c78;color:white;border-color:#166c78}.step:disabled{opacity:.5;cursor:default}.options{display:flex;gap:10px;align-items:center}.options select{border:1px solid #d1dee2;background:#fff;padding:6px;border-radius:4px}.options label{font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:610px}#map{height:610px;background:#e5ebed}.side{background:white;padding:17px;overflow:auto;max-height:610px;border-left:1px solid #d9e4e7}.side h2{font-size:18px;margin:0 0 8px}.side h3{font-size:14px;margin:17px 0 8px}.muted{color:#64808a;font-size:12px;line-height:1.7}.unit-summary{background:#edf5f5;padding:10px;border-radius:5px;line-height:1.7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.stat{padding:9px;background:#f4f7f9;border-radius:5px;font-size:12px}.stat strong{font-size:18px;display:block;margin-top:3px}.measure-row{display:flex;gap:7px;border:1px solid #dae5e6;border-radius:6px;margin:7px 0;padding:7px;align-items:center}.measure-row svg{width:78px;height:65px;flex-shrink:0}.measure-row b{display:block;font-size:13px}.measure-row small{color:#7a9097;font-size:11px}.notice{font-size:11px;padding:8px;background:#fcf5e6;border-radius:4px;color:#836234;line-height:1.7}.legend{background:#ffffffeb;padding:9px;border-radius:6px;box-shadow:0 2px 8px #17313b25;max-width:270px;font-size:12px}.legend div{margin:4px 0}.swatch{display:inline-block;width:13px;height:13px;border-radius:2px;margin-right:7px;vertical-align:middle}.measure-marker{background:white;border:2px solid #157180;border-radius:12px;box-shadow:0 3px 10px #122b4666;overflow:visible}.measure-marker svg{width:54px;height:47px;display:block}.measure-marker .short{white-space:nowrap;position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:10px;background:#fffef3e8;padding:2px 4px;border-radius:3px;color:#16333b;box-shadow:0 2px 4px #122b4622}.unit-tag{font-weight:bold;color:#fff;background:#164653dd;border:1px solid #fff;border-radius:4px;padding:2px 5px;text-align:center}.foot{padding:7px 14px;background:#eaf0f2;font-size:11px;color:#58717c;display:flex;justify-content:space-between;gap:14px}.tile-status{color:#aa6522}.leaflet-popup-content{line-height:1.7}.leaflet-container{font-family:"Microsoft YaHei",sans-serif}.planbar{display:flex;gap:15px;align-items:center;padding:10px 17px;background:#f0f6f6;border-bottom:1px solid #d5e1e5}.planbar select{padding:7px;border:1px solid #bed2d6;border-radius:5px}.planbar strong{font-size:16px}.large-number{font-size:22px;color:#176977}.detail-list{margin:9px 0;padding-left:18px;font-size:12px;color:#4e6771;line-height:1.8}@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr) 240px}.side{padding:11px}.toolbar{padding:8px}.step{padding:7px 8px}.top{padding:12px}.options{gap:5px}.measure-row svg{width:55px}.planbar{gap:8px;flex-wrap:wrap}}@media(max-width:580px){.layout{display:block}#map{height:440px}.side{max-height:none}.top{display:block}.status{display:block;margin-top:7px}}
</style></head><body>
<header class="top" id="header"><div><h1>村域综合治理空间方案</h1><p id="studyName"></p></div><span class="status" id="dataStatus"></span></header>
<div class="planbar" id="planbar"><label>代表方案 <select id="scheme" aria-label="代表方案"></select></label><div id="planMetrics"></div></div>
<div class="toolbar"><div class="steps"><button class="step" data-step="input">1 已有评价</button><button class="step" data-step="priority">2 重点区域</button><button class="step" data-step="units">3 治理单元</button><button class="step" data-step="measures">4 工程措施</button></div><div class="options"><select id="field" aria-label="评价图层"><option value="risk">风险等级</option><option value="susceptibility">易发性</option><option value="vulnerability">易损性</option><option value="slope_deg">坡度</option></select><select id="basemap" aria-label="真实底图"><option value="imagery">卫星影像</option><option value="street">地理底图</option></select><label><input id="paths" type="checkbox">显示路径</label><button id="fit" class="step">定位研究范围</button></div></div>
<main class="layout"><div id="map" aria-label="真实地图与治理图层"></div><aside class="side"><h2 id="panelTitle">治理对象识别</h2><div id="panelContent"></div></aside></main>
<footer class="foot"><span id="tileStatus" class="tile-status">正在加载真实底图…</span><span id="rangeNote">范围为演示研究范围；图标为单元级配置示意，非施工点位。</span></footer>
<script>__LEAFLET_JS__</script><script>
const DATA=__PAYLOAD__;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const result=DATA.result;let activeStep=result?'measures':'input', currentLabel=DATA.label||(result?result.representative_solutions[0].label:null), selected=DATA.selected;
const map=L.map('map',{preferCanvas:true,zoomControl:true,zoomSnap:.25,zoomDelta:.5});
const baseLayers={imagery:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Esri, Maxar, Earthstar Geographics, GIS User Community'}),street:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'})};
let activeBase=baseLayers.imagery;activeBase.addTo(map);Object.values(baseLayers).forEach(layer=>{layer.on('tileload',()=>{$('tileStatus').textContent='真实底图已加载 · 评价数据与工程配置按实际坐标叠加'});layer.on('tileerror',()=>{$('tileStatus').textContent='部分底图瓦片加载失败，可切换底图；计算图层仍可查看'});});
L.control.scale({imperial:false}).addTo(map);
const boundary=L.geoJSON(DATA.boundary,{style:{color:'#ffffff',weight:3,fillOpacity:0,dashArray:'7 5'}}).addTo(map), bounds=boundary.getBounds();map.fitBounds(bounds,{padding:[28,28]});
let overlay=L.layerGroup().addTo(map),selection=L.layerGroup().addTo(map);
const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const div=L.DomUtil.create('div','legend');div.id='legend';L.DomEvent.disableClickPropagation(div);return div;};legend.addTo(map);
$('studyName').textContent=DATA.village.name;
$('dataStatus').textContent=DATA.village.data_status==='MOCK'?'真实位置参照 · 模拟评价 / 调查 / 路径':'来源以输入资料声明为准';
if(DATA.embedded){$('header').style.display='none';$('planbar').style.display='none';}
if(!result){$('planbar').style.display='none';document.querySelector('[data-step="measures"]').disabled=true;}
else{for(const s of result.representative_solutions){const o=document.createElement('option');o.value=o.textContent=s.label;$('scheme').append(o);}$('scheme').value=currentLabel;}
const units=()=>result?result.map_result.solutions[currentLabel]:DATA.units;
const palette=['#f6edac','#edd278','#f3a650','#d96b41','#b5333c'];
function fieldColor(p){let value=p[$('field').value];if(value===undefined)return '#abb8be';if($('field').value==='slope_deg')value=value/18+1;else if($('field').value!=='risk')value=value*4+1;return palette[Math.max(0,Math.min(4,Math.floor(value)-1))];}
function unitColor(p){const mid=(p.measure_ids||'').split('+')[0];return DATA.colors[mid]||['#278e99','#98754a','#8e77b1','#477fad'][Number(p.unit_id.slice(1))%4];}
function infoOverview(){
const m=DATA.metrics,cfg=m.configuration||{};const titles={input:'哪些资料参与计算？',priority:'为什么纳入治理？',units:'治理单元如何形成？',measures:'在哪里采用什么措施？'};$('panelTitle').textContent=titles[activeStep];
let text='<div class="stats"><div class="stat">输入像元<strong>'+esc(m.valid_features||DATA.evaluation.features.length)+'</strong></div><div class="stat">重点像元<strong>'+esc(m.priority_features)+'</strong></div><div class="stat">治理单元<strong>'+esc(m.governance_unit_count)+'</strong></div><div class="stat">重点面积 / 公顷<strong>'+Number(m.priority_area_m2/10000).toFixed(2)+'</strong></div></div>';
const descriptions={input:'当前彩色网格来自上传的已有空间评价成果。切换风险、易发性、易损性或坡度图层，点击像元查看原值；底图影像本身不参与风险评分。',priority:'当前配置：风险等级≥'+esc(cfg.risk_threshold??3)+'，或距承灾体≤'+esc(cfg.receptor_distance_m??100)+'米，或已有隐患/重点关注标记。红色重点区域由规则计算。',units:'裁剪研究范围 → 判定重点像元 → 同一调查属性区内共边连通 → 小斑块过滤 → 编号与属性统计。边界来自选中像元的实际并集；最小面积'+esc(cfg.min_area_m2)+'平方米，邻近合并距离'+esc(cfg.merge_distance_m)+'米。点击单元可追溯来源。',measures:'彩色面表示治理范围，立体示意符号表示该单元推荐的措施。点击符号或单元查看配置与模型预测改善；切换代表方案会更新措施。'};
text+='<div class="unit-summary">'+descriptions[activeStep]+'</div><h3>输入与输出的区别</h3><ul class="detail-list"><li>输入：研究范围、评价栅格、调查条件、显式空间权重与路径、预算。</li><li>自动输出：重点区域、治理单元、候选方案和措施空间配置。</li><li>无需上游预先画出治理单元或提供U01编号。</li></ul><div class="notice">'+(DATA.village.data_status==='MOCK'?'真实地点仅提供地理参照。当前范围、评价数值、调查及路径均为模拟，不代表当地存在相应地灾。':'使用前应复核输入资料来源和工程条件。')+'</div>';$('panelContent').innerHTML=text;
}
function showUnit(feature){const p=feature.properties;selected=p.unit_id;selection.clearLayers();L.geoJSON(feature,{style:{color:'#ffe28b',weight:4,fillOpacity:0},interactive:false}).addTo(selection);$('panelTitle').textContent=p.unit_id+' 治理配置';
let text='<div class="unit-summary">面积 '+(p.area_m2/10000).toFixed(2)+' 公顷 · 原风险 '+esc(p.risk)+' 级<br>来源 '+p.source_feature_ids.length+' 个评价像元 · 调查区 '+esc(p.profile_id)+'</div>';
const mids=(p.measure_ids||'').split('+').filter(x=>x&&x!=='NONE');if(activeStep==='measures'&&result){for(const mid of mids){text+='<div class="measure-row">'+(DATA.symbols[mid]||'')+'<div><b>'+esc(DATA.names[mid]||mid)+'</b><small>单元级配置示意</small></div></div>';}if(!mids.length)text+='<p>当前方案未配置工程措施。</p>';
text+='<div class="stats"><div class="stat">费用 / 万元<strong>'+Number(p.lifecycle_cost).toFixed(1)+'</strong></div><div class="stat">安全性 / 分<strong>'+Number(p.safety).toFixed(1)+'</strong></div><div class="stat">安全变化<strong>'+Number(p.safety_before).toFixed(1)+' → '+Number(p.safety).toFixed(1)+'</strong></div><div class="stat">韧性变化<strong>'+Number(p.resilience_before).toFixed(1)+' → '+Number(p.resilience).toFixed(1)+'</strong></div></div>';}
text+='<h3>生成依据</h3><p class="muted">'+esc(p.selection_reasons.join('；'))+'</p><p class="muted">平均易发性 '+(p.mean_susceptibility===undefined?'未提供':Number(p.mean_susceptibility).toFixed(3))+' · 平均易损性 '+(p.mean_vulnerability===undefined?'未提供':Number(p.mean_vulnerability).toFixed(3))+'<br>最大坡度 '+Number(p.max_slope_deg).toFixed(1)+'°</p><details><summary>查看来源像元编号</summary><p class="muted">'+esc(p.source_feature_ids.join('、'))+'</p></details><div class="notice" style="margin-top:12px">图标位置是单元内代表点，不是施工轴线。图标数不代表桩数、挡墙长度或工程量。效应与成本仍需工程标定。</div>';$('panelContent').innerHTML=text;}
function draw(){overlay.clearLayers();selection.clearLayers();document.querySelectorAll('.step[data-step]').forEach(b=>b.classList.toggle('active',b.dataset.step===activeStep));$('field').disabled=activeStep!=='input';infoOverview();
if(activeStep==='input'){L.geoJSON(DATA.evaluation,{style:f=>({fillColor:fieldColor(f.properties),fillOpacity:.60,color:'#334b5544',weight:.3}),onEachFeature:(f,layer)=>layer.bindPopup('<b>输入像元 '+esc(f.properties.feature_id)+'</b><br>风险 '+esc(f.properties.risk)+' 级 · 危险性 '+esc(f.properties.haz)+' 级<br>易发性 '+esc(f.properties.susceptibility??'未提供')+' · 易损性 '+esc(f.properties.vulnerability??'未提供')+'<br>坡度 '+esc(f.properties.slope_deg)+'° · 距承灾体 '+esc(f.properties.distance_m)+'m')}).addTo(overlay);$('legend').innerHTML='<b>'+esc($('field').selectedOptions[0].text)+'</b>'+palette.map((c,i)=>'<div><i class="swatch" style="background:'+c+'"></i>'+($('field').value==='risk'?(i+1)+' 级':['低','较低','中','较高','高'][i])+'</div>').join('');}
if(activeStep==='priority'){L.geoJSON(DATA.priority,{style:{color:'#ff8a52',weight:.6,fillColor:'#df6846',fillOpacity:.65},onEachFeature:(f,layer)=>layer.bindPopup('<b>'+esc(f.properties.feature_id)+'</b><br>'+esc(f.properties.selection_reasons.join('；')))}).addTo(overlay);$('legend').innerHTML='<i class="swatch" style="background:#df6846"></i>计算得到的重点治理像元';}
if(activeStep==='units'||activeStep==='measures'){L.geoJSON(units(),{style:f=>({color:'#fff2cb',weight:2,fillColor:unitColor(f.properties),fillOpacity:.30}),onEachFeature:(f,layer)=>{layer.on('click',()=>showUnit(f));layer.bindTooltip(f.properties.unit_id+' · '+(f.properties.area_m2/10000).toFixed(2)+'公顷');}}).addTo(overlay);
for(const f of units().features){const p=f.properties;L.marker([p.latitude,p.longitude],{icon:L.divIcon({className:'unit-tag',html:esc(p.unit_id),iconSize:[40,21]})}).on('click',()=>showUnit(f)).addTo(overlay);}
$('legend').innerHTML='<b>治理单元</b><div>彩色边界 = 计算得到的治理范围</div><div>金色高亮 = 当前选择单元</div>';}
if(activeStep==='measures'&&result){const points=result.map_result.measure_placements[currentLabel].features;for(const f of points){const p=f.properties;L.marker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{icon:L.divIcon({className:'measure-marker',html:(DATA.symbols[p.measure_id]||'')+'<span class="short">'+esc(p.measure_name)+'</span>',iconSize:[58,52],iconAnchor:[29,26]})}).on('click',()=>showUnit(units().features.find(u=>u.properties.unit_id===p.unit_id))).bindTooltip(p.unit_id+' '+p.measure_name+'（配置示意）').addTo(overlay);}
$('legend').innerHTML='<b>工程措施图例</b>'+[...new Set(points.map(f=>f.properties.measure_id))].map(mid=>'<div><i class="swatch" style="background:'+DATA.colors[mid]+'"></i>'+esc(DATA.names[mid]||mid)+'</div>').join('');}
if($('paths').checked){for(const f of DATA.context.features||[]){if(f.properties.kind==='path')L.geoJSON(f,{style:{color:'#e9cf5c',weight:3,dashArray:'7 5'}}).bindTooltip(esc(f.properties.name||f.properties.record_id)+' · 显式输入路径').addTo(overlay);}}
if(selected&&(activeStep==='units'||activeStep==='measures')){const f=units().features.find(f=>f.properties.unit_id===selected);if(f)showUnit(f);}
if(result){const s=result.representative_solutions.find(s=>s.label===currentLabel);$('planMetrics').innerHTML='全寿命成本 <strong class="large-number">'+s.total_cost.toFixed(1)+'</strong> 万元　安全 '+s.objectives.safety.toFixed(1)+'　韧性 '+s.objectives.resilience.toFixed(1)+'　路径完整覆盖 '+s.path_coverage.toFixed(1)+'%';}}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{activeStep=b.dataset.step;draw();}));$('field').addEventListener('change',draw);$('paths').addEventListener('change',draw);$('scheme').addEventListener('change',()=>{currentLabel=$('scheme').value;draw();});$('basemap').addEventListener('change',()=>{map.removeLayer(activeBase);activeBase=baseLayers[$('basemap').value];activeBase.addTo(map);});$('fit').addEventListener('click',()=>map.fitBounds(bounds,{padding:[28,28]}));draw();
</script></body></html>
